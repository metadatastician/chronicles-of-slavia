# Chronicles of Slavia — mise tool configuration
# This is a Rust/Bevy game project. Only Rust-relevant tools are declared.

[tools]
# Language runtime
rust = "latest"

# Build and quality
cargo-audit = "latest"
cargo-llvm-cov = "latest"
cargo-watch = "latest"
just = "latest"
git-cliff = "latest"

[env]
# Rust-specific
CARGO_TERM_COLOR = "always"
RUST_BACKTRACE = "1"

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronicles of Slavia — Zone A: Border Path</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05060c; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif; color: #eae6df;
  }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { image-rendering: auto; box-shadow: 0 0 60px rgba(0,0,0,0.8); }
  #hint {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 13px; color: #9aa; letter-spacing: .3px; opacity: .85;
    background: rgba(0,0,0,.35); padding: 6px 14px; border-radius: 20px;
    pointer-events: none; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="hint">A / D move &nbsp;·&nbsp; Shift run &nbsp;·&nbsp; Space jump &nbsp;·&nbsp; ↓ duck &nbsp;·&nbsp; Tab switch girl &nbsp;·&nbsp; E reach / read &nbsp;·&nbsp; R restart</div>
<script>
"use strict";
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Fit the fixed-resolution canvas into the window, preserving aspect (letterbox).
function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fit); fit();

// ---- input (with proper edge detection) -----------------------------------
const down = new Set(), tapped = new Set();
addEventListener('keydown', e => {
  const k = e.code;
  if (['Tab','Space','ArrowLeft','ArrowRight','ArrowUp'].includes(k)) e.preventDefault();
  if (!down.has(k)) tapped.add(k);
  down.add(k);
});
addEventListener('keyup', e => down.delete(k(e)));
function k(e){ return e.code; }
const held = c => down.has(c);
const tap  = c => tapped.has(c);

// ---- world layout ---------------------------------------------------------
const GROUND = 560;
const GORGE = { x0: 575, x1: 745 };            // the stream gap (wide: unjumpable open water)
const beats = {
  entrance: 140, grove: 340, shrine: 500, bridge: 660,
  ridge: 860, overlook: 1050, fracture: 1210
};

let state;
function reset(introTime = 5.5) {
  state = {
    active: 'anya',
    anya:  girl('anya',  160, 1.00, 6.6),   // verve 1.0 — energy: springy, flowing
    donna: girl('donna', 210, 0.42, 4.6),   // verve 0.42 — stability: planted, damped
    _natureMsg: false,
    birds: Array.from({length: 7}, (_, i) => ({
      x: beats.grove - 40 + (i * 16), baseY: 360 + (i % 3) * 22,
      y: 360, phase: Math.random() * 6.28, mood: 'neutral', flap: 0
    })),
    bridgeStable: false,
    bridgeShake: 0,
    shrineRead: false,
    whole: false,
    rift: 0,                 // 0 = dormant, else rising 0..1
    riftDone: false,
    msg: 'Two girls. One heart. A quiet border, before the world breaks.',
    msgT: 6,
    intro: 5.5,
    done: { stirred:false, settled:false, crossed:false, whole:false, rift:false }
  };
}
function girl(id, x, verve, speed) {
  // verve scales how energetically the body reacts (Anya high, Donna low).
  return { id, x, y: GROUND - 94, w: 36, h: 94, speed, verve,
           vy: 0, onGround: true, vx: 0, facing: 1, gait: 0, idle: 0,
           walk: Math.random()*6, duck: 0, hairX: 0, hairY: 0,
           depth: 0, inWater: false, swimT: 0, swamMsg: false, lastSafeX: x };
}
reset();

function active(){ return state[state.active]; }
function other(){ return state.active === 'anya' ? state.donna : state.anya; }
function say(t, dur=3){ state.msg = t; state.msgT = dur; }

// ---- update ----------------------------------------------------------------
let last = performance.now();
function update(dt) {
  if (state.intro > 0) { state.intro -= dt; }
  if (state.msgT > 0) state.msgT -= dt;
  if (state.bridgeShake > 0) state.bridgeShake -= dt;

  // switch girl
  if (tap('Tab')) {
    state.active = state.active === 'anya' ? 'donna' : 'anya';
    say(state.active === 'anya' ? 'Anya — she stirs the world.' : 'Donna — she settles it.', 2);
  }
  // restart — clear the tap BEFORE returning, or 'KeyR' stays "just-pressed"
  // forever and the game re-resets every frame (stuck on the start screen).
  if (tap('KeyR')) { reset(0.8); tapped.clear(); return; }

  const a = active();
  const running = held('ShiftLeft') || held('ShiftRight');
  const ducking = (held('ArrowDown') || held('ControlLeft')) && a.onGround;
  let dx = 0;
  if (held('KeyA') || held('ArrowLeft'))  dx -= 1;
  if (held('KeyD') || held('ArrowRight')) dx += 1;

  // water depth across the gorge: 0 at the banks, deepest in the middle (open
  // water until Donna steadies the bridge). She can wade in, cool off, and swim,
  // but the far bank is an unclimbable cliff — only the bridge lets her cross.
  const cx0 = a.x + a.w/2;
  const t = (cx0 - GORGE.x0) / (GORGE.x1 - GORGE.x0);
  const depth = (t > 0 && t < 1 && !state.bridgeStable)
    ? Math.sin(Math.max(0, Math.min(1, t)) * Math.PI) : 0;
  const inWater = depth > 0.02;

  let spd = a.speed * (running ? 1.7 : 1) * (ducking ? 0.4 : 1);
  spd *= 1 - depth * 0.6;                            // wading slows with depth
  a.x += dx * spd * dt * 60;
  if (dx !== 0) a.facing = dx > 0 ? 1 : -1;

  // jump — from solid, near-dry ground only (you can't leap out of deep water)
  if ((tap('Space') || tap('ArrowUp')) && a.onGround && !ducking && depth < 0.15) {
    a.vy = -12 - a.verve * 4.5; a.onGround = false;
  }

  if (inWater) {
    a.onGround = false; a.depth = depth;
    // submerge by depth: wet feet -> skirts -> just head above; gentle bob
    const targetY = GROUND - a.h + depth * a.h * 0.80 + Math.sin(a.idle * 2) * 1.2;
    a.y += (targetY - a.y) * Math.min(1, dt * 7); a.vy = 0;
    a.x = Math.min(a.x, GORGE.x1 - a.w * 0.5 - 2);   // reach the far bank, can't climb it
    // treading DEEP water tires; the shallows are fine to linger in (cooling off)
    a.swimT = depth > 0.55 ? a.swimT + dt : Math.max(0, a.swimT - dt * 1.5);
    if (!a.swamMsg && depth > 0.4) {
      say('Deep water — she can wade and cool off, but the far bank is too high. Only Donna can steady the crossing.', 4);
      a.swamMsg = true;
    }
    if (a.swimT > 6) {                                // the current takes her back
      a.x = Math.max(40, a.lastSafeX - 25); a.y = GROUND - a.h; a.vy = 0;
      a.onGround = true; a.swimT = 0; a.swamMsg = false; a.depth = 0;
      say('The current pulls her back to the bank.', 3);
    }
  } else {
    if (a.onGround) a.lastSafeX = a.x;
    a.depth = 0; a.swimT = 0; a.swamMsg = false;
    a.vy += 34 * dt; a.y += a.vy * dt * 60;
    const floor = GROUND - a.h;
    if (a.y >= floor) { a.y = floor; a.vy = 0; a.onGround = true; }
  }
  a.inWater = inWater;
  a.x = Math.max(40, Math.min(W - 40 - a.w, a.x));

  // per-girl reactive animation state (active is input-driven; the other rests)
  for (const g of [state.anya, state.donna]) {
    const isA = g === a;
    const tvx = isA ? dx * spd : 0;
    const ease = 0.12 + g.verve * 0.05;
    g.vx += (tvx - g.vx) * Math.min(1, dt * 60 * ease);
    if (isA) g.duck += ((ducking ? 1 : 0) - g.duck) * Math.min(1, dt * 12);  // inactive: pose HOLDS (tactical freeze)
    const moving = g.onGround && Math.abs(g.vx) > 0.25;
    g.gait += ((moving ? 1 : 0) - g.gait) * Math.min(1, dt * 10);   // gait fades in/out
    if (moving) g.walk += dt * (6 + Math.abs(g.vx) * 1.2);          // only step when moving
    g.idle += dt * 1.6;                                             // slow breathing, always
    const flow = 1.2 + g.verve * 1.6;
    g.hairX += ((-g.vx * flow) - g.hairX) * Math.min(1, dt * 8);
    g.hairY += (((g.onGround ? 0 : g.vy) * (0.6 + g.verve)) - g.hairY) * Math.min(1, dt * 8);
  }

  // --- the living taxis: the active girl's aura moves the grove birds ---
  const auraR = 150;
  for (const b of state.birds) {
    b.phase += dt * (b.mood === 'stirred' ? 9 : b.mood === 'settled' ? 1.6 : 4);
    const near = Math.hypot(a.x + a.w/2 - b.x, a.y - b.y) < auraR;
    if (state.rift > 0.4) {
      b.mood = 'disrupted';
    } else if (near) {
      b.mood = state.active === 'anya' ? 'stirred' : 'settled';
      if (b.mood === 'stirred') state.done.stirred = true;
      if (b.mood === 'settled') state.done.settled = true;
    }
    // motion by mood
    const target = b.mood === 'stirred' ? b.baseY - 70 - Math.sin(b.phase)*22
                 : b.mood === 'settled' ? b.baseY + 46 + Math.sin(b.phase*0.5)*3
                 : b.mood === 'disrupted' ? b.baseY + 30 : b.baseY + Math.sin(b.phase)*8;
    b.y += (target - b.y) * Math.min(1, dt * (b.mood === 'stirred' ? 6 : 3));
    b.flap = b.mood === 'stirred' ? 0.9 : b.mood === 'settled' ? 0.15 : b.mood === 'disrupted' ? 0 : 0.4;
    if (state.rift > 0.4) b.x += 0; // frozen in place
  }
  const firstStir = state.done.stirred, firstSettle = state.done.settled;
  if (firstStir && firstSettle && state.msgT <= 0 && !state.bridgeStable && !state._natureMsg) {
    say('Nature answers them — quickened by Anya, calmed by Donna.', 3.5); state._natureMsg = true;
  }

  // --- shrine: readable only BEFORE the Rift; miss it and it can't be heard ---
  if (tap('KeyE') && !state.shrineRead && Math.abs(a.x + a.w/2 - beats.shrine) < 70) {
    if (state.rift < 0.3) {
      state.shrineRead = true;
      say('The shrine reads: “Two lands, one heart.”', 4);
    } else {
      say('The shrine will not answer now — its light has turned wrong.', 3);
    }
  }

  // --- bridge: only DONNA stills it; ANYA can only agitate it. Either may TRY
  //     (press E); the opposition of their effects is itself the mechanic. ---
  if (!state.bridgeStable && Math.abs(a.x + a.w/2 - beats.bridge) < 130 && tap('KeyE')) {
    if (state.active === 'donna') {
      state.bridgeStable = true; state.bridgeShake = 0;
      say('Donna stills the crossing. Now it can be crossed.', 4);
    } else {
      state.bridgeShake = 1.6;   // Anya's stir sets it bucking — useless for crossing
      say('Anya only sets the crossing bucking and bullwhipping — no use for crossing.', 3.5);
    }
  }
  // record the crossing
  if (state.bridgeStable && a.x > GORGE.x1 && !state.done.crossed) {
    state.done.crossed = true;
    say('Anya crosses what Donna steadied.', 3);
  }

  // --- overlook: the world briefly feels whole ---
  if (!state.whole && a.x + a.w/2 > beats.overlook - 30) {
    state.whole = true; state.done.whole = true;
    say('From the overlook, for a moment, the world feels whole.', 4);
  }

  // --- the Fracture ---
  if (state.whole && !state.riftDone && a.x + a.w/2 > beats.fracture - 30) {
    state.rift = Math.min(1, state.rift + dt * 0.6);
    if (state.rift >= 1 && !state.riftDone) {
      state.riftDone = true; state.done.rift = true;
      say(state.shrineRead
        ? 'The Rift awakens. The birds stop answering. — end of the prelude —'
        : 'The Rift awakens. The unheard shrine glows wrong. — end of the prelude —', 8);
    } else if (!state.done.rift) {
      say('Something tears at the edge of the world…', 2);
    }
  } else if (state.rift > 0 && state.rift < 1) {
    state.rift = Math.min(1, state.rift + dt * 0.6);
  }

  tapped.clear();
}

// ---- drawing ---------------------------------------------------------------
function draw() {
  const rift = state.rift, desat = rift * 0.6;

  // sky (dusk), darkening as the Rift rises
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, mix('#241a3a', '#05040a', rift));
  sky.addColorStop(0.55, mix('#3a2f57', '#0a0713', rift));
  sky.addColorStop(1, mix('#c9825f', '#241326', Math.min(1, rift*1.2)));
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, GROUND);

  // stars appear as it darkens
  if (rift > 0.2) { ctx.fillStyle = `rgba(255,255,255,${(rift-0.2)*0.5})`;
    for (let i=0;i<70;i++){ const x=(i*97)%W, y=(i*53)%GROUND; ctx.fillRect(x,y,2,2); } }

  drawMountains(desat);
  drawForest(desat);
  drawStreamAndBridge(desat);
  drawShrine();
  drawGround(desat);
  drawOverlook();
  for (const b of state.birds) drawBird(b);

  // the active girl's aura
  const a = active();
  drawAura(a, state.active === 'anya');

  // girls (inactive behind)
  drawGirl(other(), false);
  drawGirl(a, true);

  drawWaterOverlay();   // over the girls, so submerged bodies read as underwater

  if (rift > 0) drawRift(rift);

  drawHUD();
  drawMessage();
  if (state.intro > 0) drawIntro();
}

function drawMountains(d){
  // Bulgarian foothills on the right — cool stone
  for (let layer=0; layer<3; layer++){
    const base = 300 + layer*70, col = shade(mix('#6a6f86','#2b2c3a', d), -layer*18);
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(700, GROUND);
    for (let x=700; x<=W; x+=40){
      const y = base - Math.abs(Math.sin(x*0.008 + layer)) * (120 - layer*20);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, GROUND); ctx.closePath(); ctx.fill();
  }
  // snow caps
  ctx.fillStyle = `rgba(230,235,245,${0.7-d*0.5})`;
  ctx.beginPath(); ctx.moveTo(1000,200); ctx.lineTo(1030,240); ctx.lineTo(970,240); ctx.closePath(); ctx.fill();
}
function drawForest(d){
  // Ukrainian birch on the left
  ctx.fillStyle = mix('#20361f','#0c130c', d);
  ctx.beginPath(); ctx.moveTo(0,GROUND);
  for (let x=0;x<=620;x+=30){ ctx.lineTo(x, 330 - Math.sin(x*0.02)*30); } ctx.lineTo(620,GROUND); ctx.closePath(); ctx.fill();
  for (let i=0;i<9;i++){
    const x = 30 + i*62, top = 300 + (i%3)*24;
    ctx.fillStyle = mix('#e8e6df','#5a5850', d); ctx.fillRect(x, top, 10, GROUND-top);
    ctx.fillStyle = mix('#2a2a28','#141414', d);
    for (let m=0;m<5;m++) ctx.fillRect(x, top + 20 + m*40, 10, 4);
    ctx.fillStyle = mix('#375a2f','#16240f', d);
    ctx.beginPath(); ctx.ellipse(x+5, top-6, 26, 34, 0, 0, 6.28); ctx.fill();
  }
}
function drawStreamAndBridge(d){
  // the stream in the gorge
  const g = ctx.createLinearGradient(0, GROUND-30, 0, GROUND+120);
  g.addColorStop(0, mix('#5aa0c8','#20303e',d)); g.addColorStop(1, mix('#20567a','#0b1a26',d));
  ctx.fillStyle = g; ctx.fillRect(GORGE.x0, GROUND, GORGE.x1-GORGE.x0, 160);
  // shimmer
  ctx.strokeStyle = `rgba(200,230,255,${0.25-d*0.2})`;
  for (let i=0;i<4;i++){ ctx.beginPath(); const yy=GROUND+30+i*22;
    ctx.moveTo(GORGE.x0, yy); ctx.lineTo(GORGE.x1, yy+Math.sin(performance.now()*0.002+i)*3); ctx.stroke(); }

  // bridge planks
  const stable = state.bridgeStable;
  const shake = (!stable && state.bridgeShake > 0) ? state.bridgeShake : 0;
  for (let i=0;i<6;i++){
    const px = GORGE.x0 - 6 + i*((GORGE.x1-GORGE.x0+12)/6);
    ctx.save();
    const wobble = shake ? Math.sin(performance.now()*0.03 + i*1.7) * 11 * shake : 0;
    if (!stable){ ctx.globalAlpha = 0.35 + shake*0.45; ctx.translate(0, 8 + Math.sin(i)*6 + wobble); }
    ctx.fillStyle = stable ? '#8a5a30' : (shake ? '#7a4a26' : '#4a3620');
    ctx.fillRect(px, GROUND-6, (GORGE.x1-GORGE.x0+12)/6 - 3, 12);
    ctx.restore();
  }
  if (stable){ ctx.strokeStyle='rgba(120,200,255,0.4)'; ctx.lineWidth=2;
    ctx.strokeRect(GORGE.x0-8, GROUND-9, GORGE.x1-GORGE.x0+16, 18); ctx.lineWidth=1; }
}
function drawWaterOverlay(){
  if (state.bridgeStable) return;                     // the bridge covers the water
  const wg = ctx.createLinearGradient(0, GROUND, 0, GROUND+70);
  wg.addColorStop(0, 'rgba(74,150,190,0.5)'); wg.addColorStop(1, 'rgba(28,74,112,0.85)');
  ctx.fillStyle = wg; ctx.fillRect(GORGE.x0, GROUND, GORGE.x1-GORGE.x0, 130);
  ctx.strokeStyle='rgba(210,235,255,0.45)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(GORGE.x0,GROUND); ctx.lineTo(GORGE.x1,GROUND); ctx.stroke();
  for (const g of [state.anya, state.donna]){
    const d = g.depth || 0; if (d <= 0.02) continue;
    const gx = g.x + g.w/2;
    // skirt fanning on the surface (skirt-deep)
    if (d > 0.12 && d < 0.72){
      ctx.fillStyle = (g.id==='anya') ? 'rgba(94,29,42,0.5)' : 'rgba(34,29,44,0.5)';
      ctx.beginPath(); ctx.ellipse(gx, GROUND, g.w*0.7*(0.6+d), 5+d*4, 0, 0, 6.28); ctx.fill();
    }
    // splash ripples at the waterline
    if (Math.abs(g.vx) > 0.3 || d < 0.2){
      ctx.strokeStyle='rgba(230,245,255,0.55)';
      for (let r=0;r<3;r++){ const rr=6+r*7+Math.sin(g.idle*4+r)*2;
        ctx.beginPath(); ctx.arc(gx, GROUND, rr, Math.PI*1.05, Math.PI*1.95); ctx.stroke(); }
    }
  }
  ctx.lineWidth=1;
}
function drawShrine(){
  const x = beats.shrine, y = GROUND-96;
  const bad = state.rift > 0 && !state.shrineRead;         // reached the Rift unheard
  // glow behind the shrine — warm if read, angry red pulse if it was missed
  if (state.shrineRead || bad){
    const pulse = 0.5 + 0.5*Math.sin(performance.now()*0.006);
    const gc = bad ? `rgba(230,40,40,${0.22 + 0.4*pulse})` : 'rgba(233,120,90,0.20)';
    const grd = ctx.createRadialGradient(x, y+30, 4, x, y+30, 78 + (bad?pulse*22:0));
    grd.addColorStop(0, gc); grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(x, y+30, 90, 0, 6.28); ctx.fill();
  }
  ctx.fillStyle = '#39323f'; ctx.fillRect(x-22, y, 44, 96);
  ctx.beginPath(); ctx.moveTo(x-34,y); ctx.lineTo(x, y-30); ctx.lineTo(x+34,y); ctx.closePath();
  ctx.fillStyle='#4a3f52'; ctx.fill();
  // heart-rune: warm if read, wrong/angry red if missed before the Rift, else dim
  ctx.fillStyle = state.shrineRead ? '#e94f6a' : (bad ? '#ff2e2e' : '#7a6f82');
  ctx.beginPath(); ctx.arc(x-6,y+38,7,0,6.28); ctx.arc(x+6,y+38,7,0,6.28);
  ctx.moveTo(x-13,y+41); ctx.lineTo(x,y+58); ctx.lineTo(x+13,y+41); ctx.fill();
  if (state.shrineRead){ ctx.fillStyle='#e8e0d8'; ctx.font='italic 15px Georgia'; ctx.textAlign='center';
    ctx.fillText('“Two lands, one heart.”', x, y-44); ctx.textAlign='left'; }
}
function drawGround(d){
  ctx.fillStyle = mix('#2b3a26','#10160e', d);
  ctx.fillRect(0, GROUND, GORGE.x0, 160);
  ctx.fillRect(GORGE.x1, GROUND, W-GORGE.x1, 160);
  ctx.fillStyle = mix('#3c5a30','#18240f', d);
  for (let x=0;x<W;x+=16){ if (x>GORGE.x0-16 && x<GORGE.x1) continue;
    ctx.fillRect(x+(x*7%9), GROUND-3, 3, 8+(x*13%7)); }
}
function drawOverlook(){
  const x=beats.overlook;
  ctx.fillStyle='#454a5c'; ctx.fillRect(x-40, GROUND-14, 120, 14);
  ctx.strokeStyle='#767c92'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x-40,GROUND-14); ctx.lineTo(x+80,GROUND-14); ctx.stroke(); ctx.lineWidth=1;
  if (state.whole){ ctx.fillStyle='rgba(255,240,200,0.10)'; ctx.beginPath();
    ctx.arc(x+20, GROUND-120, 120, 0, 6.28); ctx.fill(); }
}
function drawBird(b){
  const col = b.mood==='stirred' ? '#ffbf5a' : b.mood==='settled' ? '#8fd0f0'
            : b.mood==='disrupted' ? '#6d6d72' : '#e8e6df';
  ctx.strokeStyle = col; ctx.lineWidth = 2.4;
  const w = 8 + b.flap*6, yy = b.mood==='disrupted' ? 0 : Math.sin(b.phase)*b.flap*7;
  ctx.beginPath();
  ctx.moveTo(b.x-w, b.y+yy); ctx.lineTo(b.x, b.y-3); ctx.lineTo(b.x+w, b.y+yy);
  ctx.stroke(); ctx.lineWidth = 1;
}
function drawAura(g, warm){
  const cx=g.x+g.w/2, cy=g.y+g.h/2, R=150;
  const grd = ctx.createRadialGradient(cx,cy,10, cx,cy,R);
  const c = warm ? '255,180,90' : '110,190,240';
  grd.addColorStop(0, `rgba(${c},0.16)`); grd.addColorStop(1, `rgba(${c},0)`);
  ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(cx,cy,R,0,6.28); ctx.fill();
}
// ---- folk-costume palette + embroidery stamps ----
const LINEN='#f2ede0', EMRED='#b5202a', EMBLK='#241a1a', GOLD='#d7a63f', SKIN='#e9c4a0',
      HUTSUL_SKIRT='#5e1d2a', KEPTAR='#8a5a2c', CORAL='#d8402e', ANYA_HAIR='#6b3a1e',
      RHODOPE_SUKMAN='#221d2c', RIZA='#efe8da', RHODOPE_APRON='#7a2130',
      RHODOPE_STRIPE='#c98a3a', SCARF='#39415a', DONNA_HAIR='#2c2620';
function rhomb(x,y,s,col){ ctx.fillStyle=col; ctx.beginPath();
  ctx.moveTo(x,y-s); ctx.lineTo(x+s,y); ctx.lineTo(x,y+s); ctx.lineTo(x-s,y); ctx.closePath(); ctx.fill(); }
function crossX(x,y,s,col){ ctx.strokeStyle=col; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x-s,y-s); ctx.lineTo(x+s,y+s); ctx.moveTo(x+s,y-s); ctx.lineTo(x-s,y+s); ctx.stroke(); }
// horizontal embroidered band, alternating red rhomb / black cross
function emBand(x0,x1,y,s){ let i=0;
  for (let x=x0+s; x<=x1-s; x+=s*2, i++){ if (i%2===0) rhomb(x,y,s*0.8,EMRED); else crossX(x,y,s*0.65,EMBLK); } }

function drawGirl(g, activeOne){
  const anya = g.id === 'anya';
  const v = g.verve;
  const cx = g.x + g.w/2, footY = g.y + g.h;
  const duck = g.duck || 0;
  const H = g.h;   // constant; ducking sinks the hips (hipDrop) — it must not shrink her
  const air = !g.onGround;
  const gait = g.gait || 0;
  const lean = Math.max(-0.30, Math.min(0.30, (g.vx||0) * 0.04 * (0.5 + v)));
  const stride = Math.sin(g.walk) * gait;
  const bounce = Math.abs(Math.sin(g.walk)) * gait * (1 + v*1.3);
  const breathe = Math.sin(g.idle || 0) * 0.6 * (1 - gait);
  // skirt billows as she falls, narrows as she rises — heavier dress billows less
  const billow = (air ? (g.vy||0) : 0) * 0.03 * (1.1 - v*0.4);
  const bw = Math.max(0.85, Math.min(1.3, 1 + billow));
  const sway = (g.vx||0) * 0.8 + Math.sin(g.walk) * gait * (1.2 + v*2);
  const hairX = (g.hairX||0), hairLift = -(g.hairY||0) * 0.6;

  ctx.save();
  ctx.globalAlpha = activeOne ? 1 : 0.5;
  ctx.translate(cx, footY - bounce - breathe);
  ctx.scale(g.facing || 1, 1);
  ctx.rotate(lean * 0.3);

  const hipDrop = H * 0.28 * duck;              // hips sink for a real crouch (not a shrink)
  const yWaist=-H*0.50+hipDrop, yChest=-H*0.62+hipDrop, yShoulder=-H*0.72+hipDrop,
        yNeck=-H*0.76+hipDrop, yHead=-H*0.86+hipDrop, rHead=H*0.092, yHemTop=-H*0.15+hipDrop*0.6;
  const hipW=g.w*0.34, shW=g.w*0.33, hemW=g.w*0.5*bw;

  // boots peeking below the hem, stepping with the walk
  ctx.fillStyle = '#3a2617';
  ctx.fillRect( stride*7 - 4, -7, 9, 9);
  ctx.fillRect(-stride*7 - 5, -7, 9, 9);

  // skirt / sukman
  ctx.fillStyle = anya ? HUTSUL_SKIRT : RHODOPE_SUKMAN;
  ctx.beginPath();
  ctx.moveTo(-hipW, yWaist); ctx.lineTo(hipW, yWaist);
  ctx.lineTo(hemW + sway, yHemTop); ctx.lineTo(-hemW + sway, yHemTop);
  ctx.closePath(); ctx.fill();

  if (anya){
    ctx.strokeStyle = GOLD; ctx.lineWidth = 1.2;
    for (let kk=1;kk<4;kk++){ const yy=yWaist+(yHemTop-yWaist)*kk/4, wl=hipW+(hemW-hipW)*kk/4;
      ctx.beginPath(); ctx.moveTo(-wl+sway*kk/4, yy); ctx.lineTo(wl+sway*kk/4, yy); ctx.stroke(); }
    emBand(-hemW+sway, hemW+sway, yHemTop-3, 3);
  } else {
    // Rhodope woven apron over the sukman — sober earthy stripes
    ctx.fillStyle = RHODOPE_APRON;
    ctx.beginPath();
    ctx.moveTo(-hipW*0.6, yWaist); ctx.lineTo(hipW*0.6, yWaist);
    ctx.lineTo(hemW*0.6+sway, yHemTop); ctx.lineTo(-hemW*0.6+sway, yHemTop);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = RHODOPE_STRIPE; ctx.lineWidth = 1.4;
    for (let kk=1;kk<5;kk++){ const yy=yWaist+(yHemTop-yWaist)*kk/5;
      ctx.beginPath(); ctx.moveTo(-hemW*0.55+sway*kk/5, yy); ctx.lineTo(hemW*0.55+sway*kk/5, yy); ctx.stroke(); }
    emBand(-hemW*0.5+sway, hemW*0.5+sway, yHemTop-3, 3);
  }

  // white blouse / riza torso
  ctx.fillStyle = anya ? LINEN : RIZA;
  ctx.beginPath();
  ctx.moveTo(-hipW*0.9, yWaist); ctx.lineTo(hipW*0.9, yWaist);
  ctx.lineTo(shW, yShoulder); ctx.lineTo(-shW, yShoulder); ctx.closePath(); ctx.fill();

  // sleeves + arms — hang STRAIGHT at the sides (front-facing figure, so no
  // horizontal swing = no crab/wave). Only a subtle vertical bob when walking.
  for (const side of [-1, 1]){
    const sx = side * shW * 0.92;
    const ay = (!air && gait > 0.08) ? Math.sin(g.walk + (side>0 ? Math.PI : 0)) * gait * (1 + v*1.2) : 0;
    ctx.fillStyle = anya ? LINEN : RIZA;              // puffed upper sleeve
    ctx.beginPath(); ctx.ellipse(sx, yShoulder + H*0.05, g.w*0.10, H*0.085, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = EMRED; ctx.fillRect(sx - g.w*0.09, yShoulder + H*0.015, g.w*0.18, 1.8);
    ctx.fillStyle = anya ? LINEN : RIZA;              // forearm hanging down
    ctx.fillRect(sx - g.w*0.035, yShoulder + H*0.12 + ay, g.w*0.07, H*0.13);
    ctx.fillStyle = SKIN;                             // hand
    ctx.beginPath(); ctx.arc(sx, yShoulder + H*0.27 + ay, g.w*0.045, 0, 6.28); ctx.fill();
  }

  if (anya){
    // keptar vest
    ctx.fillStyle = KEPTAR;
    for (const side of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(side*hipW*0.85, yWaist); ctx.lineTo(side*shW*0.9, yShoulder);
      ctx.lineTo(side*shW*0.25, yShoulder); ctx.lineTo(side*hipW*0.28, yWaist); ctx.closePath(); ctx.fill();
      ctx.strokeStyle=EMRED; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(side*shW*0.25,yShoulder); ctx.lineTo(side*hipW*0.28,yWaist); ctx.stroke();
    }
    for (let r=0;r<4;r++){ const yy=yChest+r*3;
      if (r%2===0){ rhomb(-3,yy,2.1,EMRED); rhomb(3,yy,2.1,EMRED); }
      else { crossX(-3,yy,1.7,EMBLK); crossX(3,yy,1.7,EMBLK); } }
  } else {
    // Rhodope dark bodice straps over the riza — sober
    ctx.fillStyle = RHODOPE_SUKMAN;
    ctx.fillRect(-shW, yShoulder, shW*0.5, yWaist-yShoulder);
    ctx.fillRect(shW*0.5, yShoulder, shW*0.5, yWaist-yShoulder);
    for (let r=0;r<2;r++) crossX(0, yChest+r*3, 1.7, EMRED);
  }
  emBand(-shW*0.7, shW*0.7, yShoulder+1, 2.4);   // collar

  // woven belt
  ctx.fillStyle = anya ? EMRED : RHODOPE_STRIPE;
  ctx.fillRect(-hipW, yWaist-2, hipW*2, 4);

  // coral namysto (Anya only)
  if (anya){ ctx.fillStyle=CORAL;
    for (let b=-3;b<=3;b++){ ctx.beginPath(); ctx.arc(b*2.2, yNeck, 1.4, 0, 6.28); ctx.fill(); } }

  // neck (fixed to the torso)
  ctx.fillStyle=SKIN; ctx.fillRect(-2.5, yNeck-2, 5, 5);

  // head assembly — shifts toward the way she's walking so she faces a direction
  ctx.save();
  ctx.translate(gait * 3, 0);
  ctx.fillStyle=SKIN; ctx.beginPath(); ctx.arc(0, yHead, rHead, 0, 6.28); ctx.fill();
  // nose: a clear facing cue — flips with `facing`, so left/right reads instantly
  ctx.beginPath();
  ctx.moveTo(rHead*0.75, yHead-1); ctx.lineTo(rHead*1.3, yHead+1.5); ctx.lineTo(rHead*0.7, yHead+3.5);
  ctx.closePath(); ctx.fill();

  if (anya){
    // flowing auburn hair (trails with hairX, lifts with hairLift)
    ctx.fillStyle=ANYA_HAIR;
    ctx.beginPath();
    ctx.moveTo(-rHead, yHead-1);
    ctx.quadraticCurveTo(-rHead*1.5+hairX*0.5, yHead+rHead*1.8+hairLift, -rHead*0.5+hairX, yHead+rHead*3.2+hairLift*1.4);
    ctx.quadraticCurveTo(hairX*0.7, yHead+rHead*1.4, rHead*0.3, yHead-rHead*0.6);
    ctx.quadraticCurveTo(rHead*1.3+hairX*0.3, yHead-rHead*0.3, rHead, yHead-1);
    ctx.arc(0, yHead, rHead+1, 0, Math.PI, true);
    ctx.fill();
    // vinok wreath
    const fl=['#e04a5a','#e8b53a','#5aa0d8','#e8e0d0'];
    for (let f=0;f<7;f++){ const a2=Math.PI*(0.12+0.76*f/6); ctx.fillStyle=fl[f%fl.length];
      ctx.beginPath(); ctx.arc(-Math.cos(a2)*rHead, yHead-Math.sin(a2)*rHead-1, 1.6, 0, 6.28); ctx.fill(); }
    // trailing ribbons
    for (const rb of [[-1,'#c02a3a'],[1,'#2f6fb0']]){ ctx.strokeStyle=rb[1]; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(rb[0]*rHead*0.5, yHead+rHead*0.5);
      ctx.quadraticCurveTo(rb[0]*rHead*0.6+hairX*0.9, yHead+rHead*2.2+hairLift, rb[0]*rHead*0.3+hairX*1.4, yHead+rHead*3.6+hairLift*1.3);
      ctx.stroke(); }
  } else {
    // dark hair framing the face (drawn under the kerchief)
    ctx.fillStyle = DONNA_HAIR;
    ctx.beginPath();
    ctx.arc(0, yHead, rHead+1, Math.PI*0.95, Math.PI*0.05, true);
    ctx.lineTo(rHead*0.9, yHead + rHead*0.95); ctx.lineTo(-rHead*0.9, yHead + rHead*0.95);
    ctx.closePath(); ctx.fill();
    // a folded kerchief over the crown and back — NOT a full cap (no mushroom)
    ctx.fillStyle = SCARF;
    ctx.beginPath();
    ctx.moveTo(-rHead-1, yHead-1);
    ctx.quadraticCurveTo(0, yHead - rHead*1.7, rHead+1, yHead-1);
    ctx.quadraticCurveTo(rHead*0.4, yHead + rHead*0.15, 0, yHead + rHead*0.28);
    ctx.quadraticCurveTo(-rHead*0.4, yHead + rHead*0.15, -rHead-1, yHead-1);
    ctx.closePath(); ctx.fill();
    // knot at the back with a tiny sway + a woven edge
    ctx.beginPath(); ctx.arc(-rHead*0.85 + hairX*0.1, yHead + rHead*0.45, 1.9, 0, 6.28); ctx.fill();
    ctx.strokeStyle = RHODOPE_STRIPE; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-rHead-1, yHead-1); ctx.quadraticCurveTo(0, yHead - rHead*1.5, rHead+1, yHead-1); ctx.stroke();
  }
  ctx.restore();   // end head assembly (facing shift)
  ctx.lineWidth=1;
  ctx.restore();

  // active ring + name (world coords)
  ctx.globalAlpha=1;
  if (activeOne){ ctx.strokeStyle = anya ? '#ffd27a' : '#bfe0ff'; ctx.lineWidth=2;
    roundRect(g.x-4, g.y-10, g.w+8, g.h+16, 10); ctx.stroke(); ctx.lineWidth=1; }
  ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.font='12px Segoe UI'; ctx.textAlign='center';
  ctx.fillText(anya?'Anya':'Donna', cx, footY+16); ctx.textAlign='left';
}
function drawRift(r){
  const cx=beats.fracture-140;
  ctx.save(); ctx.globalAlpha = Math.min(1, r);
  ctx.strokeStyle='#cfe9ff'; ctx.lineWidth=3+r*4; ctx.shadowColor='#8fd6ff'; ctx.shadowBlur=24;
  ctx.beginPath(); let yy=0, xx=cx;
  ctx.moveTo(xx,0);
  while(yy<GROUND){ yy+=24; xx=cx+Math.sin(yy*0.09)*22*r + (Math.random()-0.5)*8*r; ctx.lineTo(xx,yy); }
  ctx.stroke(); ctx.restore(); ctx.shadowBlur=0;
}

function drawHUD(){
  // top band with a vyshyvanka motif
  ctx.fillStyle='rgba(8,8,16,0.55)'; ctx.fillRect(0,0,W,44);
  ctx.fillStyle='#b5303f';
  for (let x=0;x<W;x+=18){ ctx.fillRect(x, 38, 6, 6); ctx.fillRect(x+3, 35, 6, 3); ctx.fillRect(x+3, 44, 6, 3); }
  ctx.fillStyle='#efe7dc'; ctx.font='bold 15px Georgia';
  ctx.fillText('Chronicles of Slavia — Zone A: Border Path', 16, 26);
  // active girl
  ctx.font='13px Segoe UI'; ctx.textAlign='right';
  ctx.fillStyle = state.active==='anya' ? '#ffbf5a' : '#8fd0f0';
  ctx.fillText('▲ ' + (state.active==='anya'?'Anya — stirs':'Donna — settles'), W-16, 26);
  ctx.textAlign='left';
  // five-beat tracker
  const labels=[['Anya stirs',state.done.stirred],['Donna settles',state.done.settled],
    ['nature answers',state.done.stirred&&state.done.settled],
    ['Donna steadies · Anya crosses',state.done.crossed],['the Rift interrupts',state.done.rift]];
  let bx=16;
  for (const [t,on] of labels){
    ctx.fillStyle = on ? '#ffd770' : 'rgba(255,255,255,0.22)';
    ctx.beginPath(); ctx.arc(bx+6, 60, 6, 0, 6.28); ctx.fill();
    ctx.fillStyle = on ? '#efe7dc' : 'rgba(230,230,230,0.4)'; ctx.font='12px Segoe UI';
    ctx.fillText(t, bx+16, 64); bx += 20 + ctx.measureText(t).width + 18;
  }
}
function drawMessage(){
  if (state.msgT<=0) return;
  const a = Math.min(1, state.msgT);
  ctx.fillStyle=`rgba(0,0,0,${0.45*a})`;
  ctx.fillRect(W/2-360, GROUND+92, 720, 44);
  ctx.fillStyle=`rgba(245,240,232,${a})`; ctx.font='italic 18px Georgia'; ctx.textAlign='center';
  ctx.fillText(state.msg, W/2, GROUND+120); ctx.textAlign='left';
}
function drawIntro(){
  const a=Math.min(1,state.intro/1.5);
  ctx.fillStyle=`rgba(4,4,10,${0.55*a})`; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle=`rgba(233,79,106,${a})`; ctx.font='bold 40px Georgia';
  ctx.fillText('CHRONICLES OF SLAVIA', W/2, H/2-30);
  ctx.fillStyle=`rgba(239,231,220,${a})`; ctx.font='20px Georgia';
  ctx.fillText('Zone A — Border Path', W/2, H/2+6);
  ctx.font='15px Segoe UI'; ctx.fillStyle=`rgba(200,200,210,${a})`;
  ctx.fillText('What do you become when the world breaks?', W/2, H/2+40);
  ctx.textAlign='left';
}

// ---- helpers ---------------------------------------------------------------
function roundRect(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function hex(c){ return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]; }
function mix(c1,c2,t){ t=Math.max(0,Math.min(1,t)); const a=hex(c1),b=hex(c2);
  return `rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')})`; }
function shade(rgb,amt){ const m=rgb.match(/\d+/g).map(n=>Math.max(0,Math.min(255,+n+amt)));
  return `rgb(${m.join(',')})`; }

// ---- loop ------------------------------------------------------------------
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000); last=now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>

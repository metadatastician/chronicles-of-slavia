# Dependabot configuration for Chronicles of Slavia
# Rust/Cargo + GitHub Actions only — no other ecosystems apply to this project.

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2

  # Rust/Cargo (engine workspace)
  - package-ecosystem: "cargo"
    directory: "/engine"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

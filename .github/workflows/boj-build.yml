# This workflow is managed by gh actions-lock.
#
# OPTIONAL: BoJ Server Build Trigger
# This workflow notifies a BoJ Server instance when code is pushed.
# It is a no-op if BOJ_SERVER_URL is not set or the server is unreachable.
# To enable: set BOJ_SERVER_URL as a repository secret or variable.
# To disable: delete this file or leave BOJ_SERVER_URL unset.
name: BoJ Server Build Trigger
on:
  push:
    branches: [main, master]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
jobs:
  trigger-boj:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No job-level `if` here: the `secrets` context is not available in
    # job-level conditions (only github/needs/vars/inputs), and referencing
    # it made GitHub reject the whole run as a 0-second failure before any
    # job was created. The run step below already no-ops cleanly when
    # BOJ_SERVER_URL is unset, which is the behavior the old guard wanted.
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Trigger BoJ Server (Casket/ssg-mcp)
        env:
          BOJ_URL: ${{ secrets.BOJ_SERVER_URL || vars.BOJ_SERVER_URL }}
          REPO_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "$BOJ_URL" ]; then
            echo "BOJ_SERVER_URL not configured - skipping"
            exit 0
          fi

          payload="$(jq -cn \
            --arg repo "$REPO_NAME" \
            --arg branch "$BRANCH_NAME" \
            --arg engine "casket" \
            '{repo:$repo, branch:$branch, engine:$engine}')"

          curl -sf -X POST "${BOJ_URL}/cartridges/ssg-mcp/invoke" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            || echo "BoJ server unreachable - skipping (non-fatal)"

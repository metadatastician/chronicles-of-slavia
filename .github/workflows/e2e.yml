#
# E2E + Aspect + Benchmark Workflow for Chronicles of Slavia
# Fires on changes to the engine tree (the actual game code).

name: E2E + Aspect + Bench
on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'tests/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'engine/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E — Game Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Build
        run: cd engine && cargo build --all-targets
      - name: Run E2E smoke test (headless)
        run: |
          cd engine && cargo test -p slavia-core --all-targets
          cd engine && cargo test -p slavia-zone-a --no-default-features --all-targets

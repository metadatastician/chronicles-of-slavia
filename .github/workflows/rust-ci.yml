# SPDX-License-Identifier: AGPL-3.0-or-later
# This workflow is managed by gh actions-lock.
# Rust CI — thin wrapper calling the shared estate reusable in
# hyperpolymath/standards. Configure once, propagate everywhere.
# See: docs/CI-REUSABLE-WORKFLOWS.adoc in standards.
name: Rust CI
on:
  push:
    branches: [main, master]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
jobs:
  rust-ci:
    uses: hyperpolymath/standards/.github/workflows/rust-ci-reusable.yml@fcb8669169b4e9f5d9848608df880ae5fae812b4
    with:
      # This repository's Cargo workspace lives below the repository root.
      # Without this input the reusable's checked-out detector truthfully sees
      # no root Cargo.toml and skips check, clippy, fmt and test.
      working_directory: engine
      enable_audit: true
      enable_coverage: true
      # Local renderer-inclusive measurement on 2026-08-29: 31.45% lines.
      # Start just below observed evidence; ratchet upward, never lower.
      coverage_floor: "31.0"

extends: default
font:
  catalog:
    merge: true
page:
  background-color: FBF7F0
  margin: [2cm, 2cm, 2cm, 2cm]
base:
  font-family: Noto Serif
  font-color: 231F1A
  font-size: 11
  line-height: 1.35
heading:
  font-color: 3A1418
  font-family: Noto Serif
  font-style: bold
  h1:
    font-size: 26
    font-color: 5B1A22
  h2:
    font-size: 18
    font-color: 5B1A22
    border-bottom-width: 0.75
    border-bottom-color: A8703C
    border-bottom-style: solid
  h3:
    font-size: 14
    font-color: 7A2A32
title-page:
  background-color: 2C2620
  font-color: FBF7F0
  title:
    font-size: 40
    font-color: F0E4CE
    font-style: bold
  subtitle:
    font-size: 18
    font-color: C98A3A
  authors:
    font-color: C4B49A
  revision:
    font-color: C4B49A
toc:
  font-color: 3A1418
  title:
    font-color: 5B1A22
sidebar:
  background-color: EFE3CE
  border-color: A8703C
  border-width: 0.5
quote:
  font-color: 5B1A22
  font-style: italic
  border-left-width: 3
  border-left-color: A8703C
  padding: [6, 6, 6, 12]
  background-color: F1E7D5
footer:
  font-color: 8C6A4A
  font-size: 9
page-numbering:
  start-at: toc

extends: default
font:
  catalog:
    merge: true
page:
  background-color: FBF3EC
  margin: [2cm, 2cm, 2cm, 2cm]
base:
  font-family: Noto Serif
  font-color: 231F1A
  font-size: 11
  line-height: 1.35
heading:
  font-color: 5E1D2A
  font-family: Noto Serif
  font-style: bold
  h1:
    font-size: 26
    font-color: 5E1D2A
  h2:
    font-size: 18
    font-color: 5E1D2A
    border-bottom-width: 0.75
    border-bottom-color: D8402E
    border-bottom-style: solid
  h3:
    font-size: 14
    font-color: 8A5A2C
title-page:
  background-color: 3A1418
  font-color: FBF3EC
  title:
    font-size: 40
    font-color: F5DDB0
    font-style: bold
  subtitle:
    font-size: 18
    font-color: D8402E
  authors:
    font-color: D0B6A0
  revision:
    font-color: D0B6A0
toc:
  font-color: 3A1418
  title:
    font-color: 5E1D2A
sidebar:
  background-color: F5E1CE
  border-color: D8402E
  border-width: 0.5
quote:
  font-color: 5E1D2A
  font-style: italic
  border-left-width: 3
  border-left-color: D8402E
  padding: [6, 6, 6, 12]
  background-color: F7E7DA
footer:
  font-color: 8A5A2C
  font-size: 9
page-numbering:
  start-at: toc

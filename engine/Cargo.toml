#
# Slavia engine workspace.
#
# Layered, renderer-agnostic architecture (see docs/decisions/0002):
#   L1  Slavia Game Spec (SGS)  — declarative data (data/*.sgs.toml)
#   L2  slavia-core             — the pure rules core (this crate)
#   L3  renderer                — a swappable skin (browser / Godot / native), later
#
# Only L2 lives here for now. L1 is the data it reads; L3 is deliberately absent
# until Zone A's rules are test-evidenced (milestone M0, "lock the sacred logic
# first"). Formal Rust verification still requires a Creusot surface.

[workspace]
resolver = "2"
members = [
    "slavia-core",        # L2 — the sacred logic
    "slavia-config",      # Configuration
    "slavia-renderer",    # Shared rendering infrastructure
    "slavia-ai",          # Game AI and Enaction integration
    "slavia-ffi",         # Cleave-aligned integration surface (optional)
    "slavia-zone-a",      # Zone A — Border Path (L3)
    "slavia-zone-b",      # Zone B — Fracture Line (L3, stub)
    "slavia-zone-c",      # Zone C — Anya's Chaos Zone (L3, stub)
    "slavia-zone-d",      # Zone D — Donna's Order Zone (L3, stub)
    "slavia-zone-e",      # Zone E — Rift Node Chamber (L3, stub)
]
